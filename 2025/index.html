<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>繽紛番茄鐘</title>
    <link rel="stylesheet" href="tomato.css">
</head>
<body>
    <div class="container">
        <h1>繽紛番茄鐘</h1>
        <div class="timer-container">
            <div class="timer" id="timer">25:00</div>
            <div class="timer-label" id="timerLabel">專注時間</div>
            <div class="buttons">
                <button id="startBtn" class="btn start">開始</button>
                <button id="pauseBtn" class="btn pause" disabled>暫停</button>
                <button id="resetBtn" class="btn reset">重置</button>
            </div>
        </div>
        <div class="tomato-container">
            <div class="tomato-count">
                <span>已完成番茄數：</span>
                <span id="tomatoCount">0</span>
            </div>
            <div class="tomatoes" id="tomatoes"></div>
        </div>
    </div>
    <audio id="focusSound" src="https://assets.mixkit.co/sfx/preview/mixkit-alarm-digital-clock-beep-989.mp3"></audio>
    <audio id="breakSound" src="https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3"></audio>
    <script src="tomato.js"></script>
</body>
</html>
